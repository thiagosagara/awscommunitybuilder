AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sandbox de Quebra de Intuicao - lab do artigo "Network for Cloud Engineers".
  Depende do stack vpc-base.yaml ja implantado com o mesmo ProjectPrefix.
  Sobe: subnet privada sem rota de saida (proposital), NAT Gateway, duas instancias
  EC2 acessiveis so via SSM (sem SSH exposto), um Security Group stateful, uma NACL
  stateless incompleta de proposito, e uma ENI avulsa para o experimento de desacoplamento.

Parameters:
  ProjectPrefix:
    Type: String
    Default: network-fundamentals
    Description: Deve ser o mesmo ProjectPrefix usado no stack vpc-base.yaml.

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 mais recente, resolvido via SSM Parameter Store.

Resources:

  # --- Subnet privada. Sem rota para o NAT Gateway de proposito.  ---
  # Essa e a Experiencia 2 do artigo: a instancia sobe, mas nao sai pra internet
  # ate o leitor adicionar a rota manualmente. Nao existe roteamento dinamico
  # descobrindo o caminho sozinho, o roteamento e voce.
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectPrefix}-vpc-id'
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-subnet'

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectPrefix}-public-subnet-id'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-natgw'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectPrefix}-vpc-id'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-rt'

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable
  # Nenhuma rota 0.0.0.0/0 criada aqui. O leitor adiciona via CLI/console
  # como parte do exercicio de tshoot. O NAT Gateway ja esta de pe, so nao
  # esta sendo usado, exatamente o tipo de coisa que custa dinheiro parada.

  # --- Security Group: stateful, so libera inbound explicito ---
  # Experiencia 1 (parte A): SSH via SSM, ICMP liberado dentro da VPC.
  # A resposta de um ping ou de uma sessao aceita sai de graca porque
  # o SG rastreia estado de conexao. Isso e o que engana quem vem de ACL Cisco.
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG stateful do lab, so ICMP inbound dentro da VPC
      VpcId: !ImportValue
        Fn::Sub: '${ProjectPrefix}-vpc-id'
      SecurityGroupIngress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: !ImportValue
            Fn::Sub: '${ProjectPrefix}-vpc-cidr'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-lab-sg'

  # --- NACL: stateless, deliberadamente incompleta ---
  # Experiencia 1 (parte B): permite ICMP inbound mas NAO libera a faixa de
  # portas efemeras no outbound. O SG deixa passar, a NACL barra o retorno.
  # Mesmo pacote, duas camadas, comportamento diferente. E aqui que a intuicao
  # de "ja libero tudo na ACL" quebra.
  LabNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !ImportValue
        Fn::Sub: '${ProjectPrefix}-vpc-id'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-lab-nacl'

  NaclInboundIcmp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref LabNetworkAcl
      RuleNumber: 100
      Protocol: 1
      RuleAction: allow
      Egress: false
      CidrBlock: !ImportValue
        Fn::Sub: '${ProjectPrefix}-vpc-cidr'
      Icmp:
        Type: -1
        Code: -1
      # Type -1 e Code -1 significam "todos os tipos e codigos ICMP".
      # A API do EC2 exige esse bloco explicito sempre que Protocol = 1 (ICMPv4),
      # mesmo que voce queira liberar tudo. Omitir ele quebra o create com
      # "must contain the parameter icmpTypeCode.type".
  # Sem regra de outbound para portas efemeras aqui de proposito.
  # O leitor adiciona (RuleNumber 110, protocolo 6, portas 1024-65535)
  # como parte do exercicio, e ve a diferenca na hora.

  NaclSubnetAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      NetworkAclId: !Ref LabNetworkAcl

  # --- IAM Role para acesso via SSM, sem SSH exposto ---
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --- Instancia publica ---
  PublicInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !ImportValue
        Fn::Sub: '${ProjectPrefix}-public-subnet-id'
      SecurityGroupIds:
        - !Ref LabSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-public-instance'

  # --- Instancia privada ---
  PrivateInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref LabSecurityGroup
      IamInstanceProfile: !Ref InstanceProfile
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-private-instance'

  # --- ENI avulsa, nao anexada a nenhuma instancia ---
  # Experiencia 3: o leitor usa describe-network-interfaces pra ver que ela
  # existe como objeto independente, depois anexa via attach-network-interface
  # numa instancia rodando, sem reboot. Quebra o modelo mental de porta fisica.
  SpareEni:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref PrivateSubnet
      GroupSet:
        - !Ref LabSecurityGroup
      Description: ENI avulsa para o experimento de desacoplamento
      Tags:
        - Key: Name
          Value: !Sub '${ProjectPrefix}-spare-eni'

Outputs:
  PublicInstanceId:
    Value: !Ref PublicInstance
  PrivateInstanceId:
    Value: !Ref PrivateInstance
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
    Description: Use este ID para adicionar a rota do NAT Gateway durante o exercicio
  NatGatewayId:
    Value: !Ref NatGateway
  SpareEniId:
    Value: !Ref SpareEni
    Description: Use este ID para o experimento de anexar/desanexar ENI
  LabNetworkAclId:
    Value: !Ref LabNetworkAcl
    Description: Use este ID para adicionar a regra de outbound de portas efemeras durante o exercicio
